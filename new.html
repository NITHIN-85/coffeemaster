<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Masters Checkout</title>
    <link rel="stylesheet" href="style.css"> <!-- Linking CSS -->
</head>
<body>

    <!-- Navbar -->
    <nav class="main-nav">
        <img src="coffee_masters_logo.png" alt="Coffee Masters Logo" class="logo">
        <span>Coffee Masters</span>
    </nav>

    <div class="page">
        <!-- Order Summary -->
        <div class="box order">
            <h2 class="box-title">ITEMS</h2>
            <ul class="items">
                <li class="item">
                    <span class="item-quantity">1x</span>
                    <span class="item-title">Cappuccino</span>
                    <span class="item-price">$6.00</span>
                    <p class="item-option">Light Foam</p>
                </li>
                <li class="item">
                    <span class="item-quantity">1x</span>
                    <span class="item-title">Cappuccino</span>
                    <span class="item-price">$7.90</span>
                    <p class="item-option">Almond Milk</p>
                </li>
                <li class="item">
                    <span class="item-quantity">1x</span>
                    <span class="item-title">Croissant</span>
                    <span class="item-price">$5.37</span>
                    <p class="item-option">Butter</p>
                </li>
            </ul>
        </div>
        <!-- Payment Details -->
        <div class="box payment">
            <h2 class="box-title">PAYMENT</h2>
            <div class="input-group">
                <label class="user-input-label" for="card">Card number</label>
                <input type="text" id="card" class="user-input">
            </div>
            <div class="input-group short-input">
                <label class="user-input-label" for="ccv">CCV Number</label>
                <input type="text" id="ccv" class="user-input">
            </div>
        </div>

        <!-- Total Summary -->
        <div class="total">
            <table class="totals-table">
                <tr><td>Subtotal:</td><td>$19.27</td></tr>
                <tr><td>Tax:</td><td>$0.96</td></tr>
                <tr class="final-totals"><td>Total:</td><td>$20.23</td></tr>
            </table>
        </div>

    </div>
    <!-- Checkout Button -->
    <button class="checkout">Place order</button>

</body>
</html>
